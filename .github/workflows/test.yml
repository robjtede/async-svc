name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with: { toolchain: nightly }

      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: just,cargo-nextest

      - name: Test
        run: just test-no-doc

  doc-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with: { toolchain: nightly }

      - name: Install just
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: just

      - name: Documentation Tests
        run: just test-doc
